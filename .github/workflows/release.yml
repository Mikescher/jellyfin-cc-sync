name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package and record the release in the manifest
        run: |
          python3 scripts/package.py \
            --version "${{ steps.version.outputs.value }}" \
            --changelog "${{ github.event.head_commit.message }}" \
            --manifest --in-repo

      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json Directory.Build.props releases
          git diff --cached --quiet || git commit -m "Release ${{ steps.version.outputs.value }}"
          git push origin HEAD:master

      - uses: softprops/action-gh-release@v2
        with:
          files: releases/jellyfin-cc-sync_${{ steps.version.outputs.value }}.zip
